<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Yanbal</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #6a1b9a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.panel {
    background: white;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #9c27b0;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    margin-top: 5px;
}

.cliente {
    background: white;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
    border-left: 5px solid #9c27b0;
}

.actions button {
    width: auto;
    margin-right: 5px;
    background: #6a1b9a;
}
</style>
</head>

<body>

<div class="header">💄 Red Yanbal - Mi Negocio</div>

<div class="panel">
    📦 Campaña actual: <b id="campText"></b><br><br>

    <input id="newCamp" placeholder="Cambiar campaña (ej: C09)">
    <button onclick="setCampania()">Cambiar campaña</button>

    <hr>

    <input id="buscar" placeholder="🔎 Buscar consultora..." onkeyup="mostrar()">
</div>

<div class="panel">

    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono (ej 51999999999)">
    <input id="zona" placeholder="Zona">
    <input id="pedido" placeholder="Pedido">
    <input id="deuda" placeholder="Deuda S/">

    <button onclick="agregar()">Agregar consultora</button>
</div>

<div id="lista"></div>

<script>
let campania = localStorage.getItem("campania") || "C08";
let data = JSON.parse(localStorage.getItem("yanbal")) || [];

function guardar(){
    localStorage.setItem("yanbal", JSON.stringify(data));
}

function setCampania(){
    let val = document.getElementById("newCamp").value;
    if(val){
        campania = val;
        localStorage.setItem("campania", campania);
        mostrarCampania();
    }
    document.getElementById("newCamp").value = "";
}

function mostrarCampania(){
    document.getElementById("campText").innerText = campania;
}

function agregar(){
    data.push({
        nombre: nombre.value,
        telefono: telefono.value,
        zona: zona.value,
        pedido: pedido.value,
        deuda: deuda.value
    });

    guardar();

    nombre.value="";
    telefono.value="";
    zona.value="";
    pedido.value="";
    deuda.value="";

    mostrar();
}

function eliminar(i){
    data.splice(i,1);
    guardar();
    mostrar();
}

function whatsapp(num, nombre){
    let msg = `Hola ${nombre} 💄 te escribo sobre tu pedido Yanbal de campaña ${campania}.`;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
}

function mostrar(){
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    data
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c,i)=>{

        lista.innerHTML += `
        <div class="cliente">

            👩 Nombre:
            <input value="${c.nombre}" 
            onchange="data[${i}].nombre=this.value; guardar()">

            📞 Teléfono:
            <input value="${c.telefono}" 
            onchange="data[${i}].telefono=this.value; guardar()">

            📍 Zona:
            <input value="${c.zona}" 
            onchange="data[${i}].zona=this.value; guardar()">

            🛒 Pedido:
            <input value="${c.pedido}" 
            onchange="data[${i}].pedido=this.value; guardar()">

            💰 Deuda:
            <input value="${c.deuda}" 
            onchange="data[${i}].deuda=this.value; guardar()">

            <br>

            💄 Campaña: ${campania}

            <div class="actions">
                <button onclick="whatsapp('${c.telefono}','${c.nombre}')">💬 WhatsApp</button>
                <a href="tel:${c.telefono}">
                    <button>📞 Llamar</button>
                </a>
                <button onclick="eliminar(${i})">🗑 Eliminar</button>
            </div>

        </div>
        `;
    });
}

mostrarCampania();
mostrar();
</script>

</body>
</html>
