<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Yanbal</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #6a1b9a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.panel {
    background: white;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 10px;
    background: #9c27b0;
    border: none;
    border-radius: 10px;
    color: white;
    margin-top: 5px;
}

.cliente {
    background: white;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
    border-left: 5px solid #9c27b0;
}
</style>
</head>

<body>

<div class="header">💄 Red Yanbal - Nube Firebase</div>

<div class="panel">

    📦 Campaña actual (local):
    <input id="campania" placeholder="Ej: C09">

    <hr>

    👩 Nombre:
    <input id="nombre">

    📞 Teléfono:
    <input id="telefono">

    📍 Zona:
    <input id="zona">

    🛒 Pedido:
    <input id="pedido">

    💰 Deuda:
    <input id="deuda">

    <button onclick="agregar()">Agregar consultora</button>
</div>

<div id="lista"></div>

<!-- 🔥 FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// 🔥 TU CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyA6xgqelvFv2ap0tpMmEipSagLWcHaTUZc",
  authDomain: "mi-red-yanbal.firebaseapp.com",
  projectId: "mi-red-yanbal",
  storageBucket: "mi-red-yanbal.firebasestorage.app",
  messagingSenderId: "82758334613",
  appId: "1:82758334613:web:32c950a0414f6b63efc39c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lista = document.getElementById("lista");

// ➕ AGREGAR CONSULTORA
window.agregar = async function(){

    let campania = document.getElementById("campania").value;
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let zona = document.getElementById("zona").value;
    let pedido = document.getElementById("pedido").value;
    let deuda = document.getElementById("deuda").value;

    await addDoc(collection(db, "consultoras"), {
        campania,
        nombre,
        telefono,
        zona,
        pedido,
        deuda
    });

    mostrar();
}

// 📄 MOSTRAR CONSULTORAS
window.mostrar = async function(){

    lista.innerHTML = "";

    let data = await getDocs(collection(db, "consultoras"));

    data.forEach((d)=>{

        let c = d.data();

        lista.innerHTML += `
        <div class="cliente">
            👩 ${c.nombre}<br>
            📞 ${c.telefono}<br>
            📍 ${c.zona}<br>
            🛒 Campaña ${c.campania}: ${c.pedido}<br>
            💰 Deuda: S/${c.deuda}<br>

            <button onclick="eliminar('${d.id}')">🗑 Eliminar</button>
        </div>
        `;
    });
}

// 🗑 ELIMINAR
window.eliminar = async function(id){
    await deleteDoc(doc(db, "consultoras", id));
    mostrar();
}

// iniciar
mostrar();

</script>

</body>
</html>
