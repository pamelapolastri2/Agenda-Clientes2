<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Agenda de Clientes</title><style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
}

.cliente {
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

.botones {
    margin-top: 5px;
}

.botones button {
    width: auto;
    margin-right: 5px;
    background: #128C7E;
}
</style></head><body><div class="header">Agenda de Clientes</div><div class="container">
    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="edad" placeholder="Edad">
    <button onclick="guardar()">Guardar</button><div id="lista"></div>

</div><script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function mostrar() {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    clientes.forEach((c, i) => {
        lista.innerHTML += `
        <div class="cliente">
            <b>${c.nombre}</b><br>
            📞 ${c.telefono}<br>
            🎂 ${c.edad}
            <div class="botones">
                <button onclick="editar(${i})">Editar</button>
                <button onclick="eliminar(${i})">Eliminar</button>
            </div>
        </div>`;
    });
}

function guardar() {
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let edad = document.getElementById("edad").value;

    clientes.push({nombre, telefono, edad});
    localStorage.setItem("clientes", JSON.stringify(clientes));

    mostrar();
}

function eliminar(i) {
    clientes.splice(i, 1);
    localStorage.setItem("clientes", JSON.stringify(clientes));
    mostrar();
}

function editar(i) {
let nuevoNombre = prompt("Nuevo nombre:", clientes[i].nombre);
let nuevoTelefono = prompt("Nuevo teléfono:", clientes[i].telefono);
let nuevaEdad = prompt("Nueva edad:", clientes[i].edad);

if (nuevoNombre) clientes[i].nombre = nuevoNombre;
if (nuevoTelefono) clientes[i].telefono = nuevoTelefono;
if (nuevaEdad) clientes[i].edad = nuevaEdad;

localStorage.setItem("clientes", JSON.stringify(clientes));
mostrar();

}

mostrar();
</script></body>
</html>
