<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Agenda Pro</title><style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
}

.cliente {
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

.hora {
    font-size: 12px;
    color: gray;
    text-align: right;
}

.botones button {
    width: auto;
    margin-top: 5px;
    background: #128C7E;
}
</style></head><body><div class="header">Agenda de Clientes 💬</div><div class="container">
    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="edad" placeholder="Edad">
    <button onclick="guardar()">Guardar</button><div id="lista"></div>

</div><script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function horaActual() {
    let h = new Date();
    return h.getHours() + ":" + h.getMinutes();
}

function mostrar() {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    clientes.forEach((c, i) => {
        lista.innerHTML += `
        <div class="cliente">
            <input value="${c.nombre}" onchange="editar(${i}, 'nombre', this.value)">
            <input value="${c.telefono}" onchange="editar(${i}, 'telefono', this.value)">
            <input value="${c.edad}" onchange="editar(${i}, 'edad', this.value)">
            
            <div class="hora">${c.hora || ""}</div>

            <div class="botones">
                <button onclick="eliminar(${i})">Eliminar</button>
            </div>
        </div>`;
    });
}

function guardar() {
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let edad = document.getElementById("edad").value;

    let hora = horaActual();

    clientes.push({nombre, telefono, edad, hora});
    localStorage.setItem("clientes", JSON.stringify(clientes));

    mostrar();
}

function eliminar(i) {
    clientes.splice(i, 1);
    localStorage.setItem("clientes", JSON.stringify(clientes));
    mostrar();
}

function editar(i, campo, valor) {
    clientes[i][campo] = valor;
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

mostrar();
</script></body>
</html>
