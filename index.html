<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Clientes</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    margin-top: 5px;
}

.search {
    background: white;
}

.cliente {
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

.actions button {
    width: auto;
    margin-right: 5px;
    background: #128C7E;
}
</style>
</head>

<body>

<div class="header">Agenda de Clientes 💬</div>

<div class="container">

<input id="buscar" class="search" placeholder="🔎 Buscar cliente..." onkeyup="mostrar()">

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="edad" placeholder="Edad">

<button onclick="agregar()">Guardar</button>

<div id="lista"></div>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function guardar() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function agregar() {
    clientes.push({
        nombre: nombre.value,
        telefono: telefono.value,
        edad: edad.value
    });

    guardar();
    limpiar();
    mostrar();
}

function limpiar() {
    nombre.value = "";
    telefono.value = "";
    edad.value = "";
}

function eliminar(i) {
    clientes.splice(i, 1);
    guardar();
    mostrar();
}

function editar(i) {
    let nuevoNombre = prompt("Nombre:", clientes[i].nombre);
    let nuevoTelefono = prompt("Teléfono:", clientes[i].telefono);
    let nuevaEdad = prompt("Edad:", clientes[i].edad);

    if (nuevoNombre) clientes[i].nombre = nuevoNombre;
    if (nuevoTelefono) clientes[i].telefono = nuevoTelefono;
    if (nuevaEdad) clientes[i].edad = nuevaEdad;

    guardar();
    mostrar();
}

function mostrar() {
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    clientes
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c, i) => {

        lista.innerHTML += `
        <div class="cliente">
            <b>${c.nombre}</b><br>
            📞 ${c.telefono}<br>
            🎂 ${c.edad}

            <div class="actions">
                <button onclick="editar(${i})">Editar</button>
                <button onclick="eliminar(${i})">Eliminar</button>
            </div>
        </div>
        `;
    });
}

mostrar();
</script>

</body>
</html>
