<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Clientes</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    font-size: 20px;
    text-align: center;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
}

.search {
    background: white;
    margin-bottom: 10px;
}

.cliente {
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.cliente img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
}

.info {
    flex: 1;
}
</style>
</head>

<body>

<div class="header">Agenda de Clientes 💬</div>

<div class="container">

    <!-- BUSCADOR -->
    <input class="search" id="buscar" placeholder="🔎 Buscar cliente..." onkeyup="mostrar()">

    <!-- FORMULARIO -->
    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="edad" placeholder="Edad">
    <input id="foto" placeholder="URL de foto (opcional)">

    <button onclick="agregar()">Guardar</button>

    <div id="lista"></div>
</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function guardar() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function agregar() {
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let edad = document.getElementById("edad").value;
    let foto = document.getElementById("foto").value;

    clientes.push({
        nombre,
        telefono,
        edad,
        foto: foto || "https://i.imgur.com/6VBx3io.png"
    });

    guardar();
    mostrar();

    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("edad").value = "";
    document.getElementById("foto").value = "";
}

function mostrar() {
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    clientes
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c, i) => {

        lista.innerHTML += `
        <div class="cliente">
            <img src="${c.foto}">
            <div class="info">
                <b>${c.nombre}</b><br>
                📞 ${c.telefono}<br>
                🎂 ${c.edad}
            </div>
        </div>
        `;
    });
}

mostrar();
</script>

</body>
</html>
