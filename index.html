<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Yanbal</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #6a1b9a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #9c27b0;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    margin-top: 5px;
}

.search {
    background: white;
}

.cliente {
    background: white;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 5px solid #9c27b0;
}

.estado {
    font-size: 12px;
    margin-top: 5px;
}

.deuda {
    color: red;
    font-weight: bold;
}

.ok {
    color: green;
}

.btns button {
    width: auto;
    margin-top: 5px;
    margin-right: 5px;
    background: #6a1b9a;
}
</style>
</head>

<body>

<div class="header">💄 Red Yanbal - Mis Consultoras</div>

<div class="container">

<input id="buscar" class="search" placeholder="🔎 Buscar consultora..." onkeyup="mostrar()">

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="zona" placeholder="Zona">
<input id="pedido" placeholder="Pedido (ej: C08)">
<input id="deuda" placeholder="Deuda (S/)">

<button onclick="agregar()">Agregar consultora</button>

<div id="lista"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("yanbal")) || [];

function guardar(){
    localStorage.setItem("yanbal", JSON.stringify(data));
}

function agregar(){
    data.push({
        nombre: nombre.value,
        telefono: telefono.value,
        zona: zona.value,
        pedido: pedido.value,
        deuda: deuda.value
    });

    guardar();

    nombre.value="";
    telefono.value="";
    zona.value="";
    pedido.value="";
    deuda.value="";

    mostrar();
}

function eliminar(i){
    data.splice(i,1);
    guardar();
    mostrar();
}

function whatsapp(num, nombre){
    let msg = `Hola ${nombre} 💄 te escribo por tu pedido Yanbal y coordinación de pago.`;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
}

function mostrar(){
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    data
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c,i)=>{

        lista.innerHTML += `
        <div class="cliente">
            <b>${c.nombre}</b><br>
            📞 ${c.telefono}<br>
            📍 ${c.zona}<br>
            🛒 Pedido: ${c.pedido}<br>

            💰 Deuda: 
            <span class="${c.deuda>0?'deuda':'ok'}">
                S/${c.deuda || 0}
            </span>

            <div class="btns">
                <button onclick="whatsapp('${c.telefono}','${c.nombre}')">💬 WhatsApp</button>
                <a href="tel:${c.telefono}">
                    <button>📞 Llamar</button>
                </a>
                <button onclick="eliminar(${i})">🗑 Eliminar</button>
            </div>
        </div>
        `;
    });
}

mostrar();
</script>

</body>
</html>
