<!DOCTYPE html>
<html>
<head>
    <title>Agenda de Clientes</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .cliente {
            background: #f1f1f1;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .acciones button {
            width: 48%;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Agenda de Clientes</h2>

    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <input id="edad" placeholder="Edad">

    <button onclick="agregarCliente()">Agregar</button>

    <div id="lista"></div>
</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function guardar() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function mostrarClientes() {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    clientes.forEach((c, i) => {
        lista.innerHTML += `
        <div class="cliente">
            <b>${c.nombre}</b><br>
            Tel: ${c.telefono}<br>
            Edad: ${c.edad}

            <div class="acciones">
                <button onclick="editar(${i})">Editar</button>
                <button onclick="eliminar(${i})">Eliminar</button>
            </div>
        </div>
        `;
    });
}

function agregarCliente() {
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let edad = document.getElementById("edad").value;

    if(nombre === "") return;

    clientes.push({ nombre, telefono, edad });
    guardar();
    mostrarClientes();

    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("edad").value = "";
}

function eliminar(i) {
    clientes.splice(i, 1);
    guardar();
    mostrarClientes();
}

function editar(i) {
    let c = clientes[i];

    document.getElementById("nombre").value = c.nombre;
    document.getElementById("telefono").value = c.telefono;
    document.getElementById("edad").value = c.edad;

    eliminar(i);
}

mostrarClientes();
</script>

</body>
</html>
