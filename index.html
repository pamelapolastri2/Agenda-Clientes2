<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Yanbal</title>

<style>
body{
    font-family: Arial;
    background:#e5ddd5;
    margin:0;
}

.header{
    background:#6a1b9a;
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
}

.panel{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#9c27b0;
    color:white;
    margin-top:5px;
    font-size:15px;
}

.cliente{
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
    border-left:5px solid #9c27b0;
}

.acciones button{
    width:auto;
    margin-right:5px;
    background:#6a1b9a;
}

.deuda{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
💄 Red Yanbal - Firebase
</div>

<div class="panel">

    <input id="campania" placeholder="Campaña (Ej: C09)">

    <input id="nombre" placeholder="Nombre">

    <input id="telefono" placeholder="Teléfono">

    <input id="zona" placeholder="Zona">

    <input id="pedido" placeholder="Pedido">

    <input id="deuda" placeholder="Deuda">

    <button onclick="agregar()">
        ➕ Agregar consultora
    </button>

</div>

<div id="lista"></div>

<script type="module">

// 🔥 FIREBASE
import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import { 
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// 🔥 CONFIGURACIÓN
const firebaseConfig = {
  apiKey: "AIzaSyA6xgqelvFv2ap0tpMmEipSagLWcHaTUZc",
  authDomain: "mi-red-yanbal.firebaseapp.com",
  projectId: "mi-red-yanbal",
  storageBucket: "mi-red-yanbal.firebasestorage.app",
  messagingSenderId: "82758334613",
  appId: "1:82758334613:web:32c950a0414f6b63efc39c"
};

// 🔥 INICIAR FIREBASE
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");

// ➕ AGREGAR CONSULTORA
window.agregar = async function(){

    let campania = document.getElementById("campania").value;
    let nombre = document.getElementById("nombre").value;
    let telefono = document.getElementById("telefono").value;
    let zona = document.getElementById("zona").value;
    let pedido = document.getElementById("pedido").value;
    let deuda = document.getElementById("deuda").value;

    await addDoc(collection(db, "consultoras"), {
        campania,
        nombre,
        telefono,
        zona,
        pedido,
        deuda
    });

    document.getElementById("nombre").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("zona").value = "";
    document.getElementById("pedido").value = "";
    document.getElementById("deuda").value = "";

    mostrar();
}

// 📄 MOSTRAR CONSULTORAS
window.mostrar = async function(){

    lista.innerHTML = "";

    const datos = await getDocs(collection(db, "consultoras"));

    datos.forEach((d)=>{

        let c = d.data();

        lista.innerHTML += `
        <div class="cliente">

            📦 Campaña:
            <input 
            value="${c.campania || ''}"
            onchange="editar('${d.id}','campania',this.value)">

            👩 Nombre:
            <input 
            value="${c.nombre || ''}"
            onchange="editar('${d.id}','nombre',this.value)">

            📞 Teléfono:
            <input 
            value="${c.telefono || ''}"
            onchange="editar('${d.id}','telefono',this.value)">

            📍 Zona:
            <input 
            value="${c.zona || ''}"
            onchange="editar('${d.id}','zona',this.value)">

            🛒 Pedido:
            <input 
            value="${c.pedido || ''}"
            onchange="editar('${d.id}','pedido',this.value)">

            💰 Deuda:
            <input 
            class="deuda"
            value="${c.deuda || ''}"
            onchange="editar('${d.id}','deuda',this.value)">

            <div class="acciones">

                <button onclick="whatsapp('${c.telefono}','${c.nombre}','${c.deuda}','${c.campania}')">
                    💬 WhatsApp
                </button>

                <a href="tel:${c.telefono}">
                    <button>
                        📞 Llamar
                    </button>
                </a>

                <button onclick="eliminar('${d.id}')">
                    🗑 Eliminar
                </button>

            </div>

        </div>
        `;
    });
}

// ✏️ EDITAR
window.editar = async function(id,campo,valor){

    await updateDoc(doc(db,"consultoras",id),{
        [campo]: valor
    });

}

// 🗑 ELIMINAR
window.eliminar = async function(id){

    await deleteDoc(doc(db,"consultoras",id));

    mostrar();
}

// 💬 WHATSAPP
window.whatsapp = function(num,nombre,deuda,campania){

    let mensaje =
`Hola ${nombre} 💄
Te escribo por tu pedido Yanbal.

📦 Campaña: ${campania}
💰 Deuda pendiente: S/${deuda}`;

    window.open(
`https://wa.me/${num}?text=${encodeURIComponent(mensaje)}`
    );
}

// 🚀 INICIAR
mostrar();

</script>

</body>
</html>
