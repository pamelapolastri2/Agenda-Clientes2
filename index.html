<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda de Clientes</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    margin-top: 5px;
}

.search {
    background: white;
}

.cliente {
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

.cliente input {
    margin: 3px 0;
    background: white;
}

.delete {
    background: #128C7E;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="header">Agenda de Clientes 💬</div>

<div class="container">

<input id="buscar" class="search" placeholder="🔎 Buscar..." onkeyup="mostrar()">

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="edad" placeholder="Edad">

<button onclick="agregar()">Guardar</button>

<div id="lista"></div>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function guardar() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function agregar() {
    clientes.push({
        nombre: nombre.value,
        telefono: telefono.value,
        edad: edad.value
    });

    guardar();
    nombre.value = "";
    telefono.value = "";
    edad.value = "";
    mostrar();
}

function eliminar(i) {
    clientes.splice(i, 1);
    guardar();
    mostrar();
}

function editarCampo(i, campo, valor) {
    clientes[i][campo] = valor;
    guardar();
}

function mostrar() {
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    clientes
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c, i) => {

        lista.innerHTML += `
        <div class="cliente">
            <input value="${c.nombre}" 
                onchange="editarCampo(${i}, 'nombre', this.value)">

            <input value="${c.telefono}" 
                onchange="editarCampo(${i}, 'telefono', this.value)">

            <input value="${c.edad}" 
                onchange="editarCampo(${i}, 'edad', this.value)">

            <button class="delete" onclick="eliminar(${i})">Eliminar</button>
        </div>
        `;
    });
}

mostrar();
</script>

</body>
</html>
