<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agenda Pro</title>

<style>
body {
    font-family: Arial;
    background: #e5ddd5;
    margin: 0;
}

.header {
    background: #075E54;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

.container {
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #25D366;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
}

.search {
    background: white;
}

.cliente {
    display: flex;
    gap: 10px;
    background: #dcf8c6;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    align-items: center;
}

.cliente img {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
}

.info {
    flex: 1;
}

.info input {
    margin: 3px 0;
}
</style>
</head>

<body>

<div class="header">Agenda de Clientes 💬</div>

<div class="container">

<input id="buscar" class="search" placeholder="🔎 Buscar..." onkeyup="mostrar()">

<input id="nombre" placeholder="Nombre">
<input id="telefono" placeholder="Teléfono">
<input id="edad" placeholder="Edad">
<input id="foto" placeholder="URL foto (opcional)">

<button onclick="agregar()">Guardar</button>

<div id="lista"></div>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function guardar() {
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function agregar() {
    clientes.push({
        nombre: nombre.value,
        telefono: telefono.value,
        edad: edad.value,
        foto: foto.value || "https://i.imgur.com/6VBx3io.png"
    });

    guardar();

    nombre.value = "";
    telefono.value = "";
    edad.value = "";
    foto.value = "";

    mostrar();
}

function eliminar(i) {
    clientes.splice(i, 1);
    guardar();
    mostrar();
}

function editar(i, campo, valor) {
    clientes[i][campo] = valor;
    guardar();
}

function mostrar() {
    let lista = document.getElementById("lista");
    let filtro = document.getElementById("buscar").value.toLowerCase();

    lista.innerHTML = "";

    clientes
    .filter(c => c.nombre.toLowerCase().includes(filtro))
    .forEach((c, i) => {

        lista.innerHTML += `
        <div class="cliente">
            <img src="${c.foto}">

            <div class="info">
                <input value="${c.nombre}" 
                    onchange="editar(${i}, 'nombre', this.value)">

                <input value="${c.telefono}" 
                    onchange="editar(${i}, 'telefono', this.value)">

                <input value="${c.edad}" 
                    onchange="editar(${i}, 'edad', this.value)">
                    <a href="tel:${c.telefono}">
    <button>📞 Llamar</button>
</a>

                <button onclick="eliminar(${i})">Eliminar</button>
            </div>
        </div>
        `;
    });
}

mostrar();
</script>

</body>
</html>
